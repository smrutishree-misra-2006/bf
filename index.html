<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Boyfriend's Day 💙</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff5f7;--card:#ffffff;--text:#3b2a30;--muted:#8a6f78;--accent:#e8506e;--accent2:#ffb3c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1217;--card:#2a1c23;--text:#fbeaf0;--muted:#c9a5b3;--accent:#ff7b9c;--accent2:#5a2a3b}}
:root[data-theme="dark"]{--bg:#1c1217;--card:#2a1c23;--text:#fbeaf0;--muted:#c9a5b3;--accent:#ff7b9c;--accent2:#5a2a3b}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
section{max-width:720px;margin:0 auto;padding:56px 22px;text-align:center}
h1,h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;margin:0 0 12px}
h1{font-size:clamp(2.4rem,9vw,4rem);line-height:1.1}
h1 em{color:var(--accent)}
h2{font-size:clamp(1.6rem,6vw,2.2rem)}
p{color:var(--muted);margin:0 0 14px}
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.heart{font-size:3rem;animation:beat 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.btn{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 28px;font:500 1rem Poppins,sans-serif;cursor:pointer;margin-top:16px;transition:transform .15s}
.btn:active{transform:scale(.95)}
.counter{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.counter div{background:var(--card);border-radius:16px;padding:14px 18px;min-width:84px;box-shadow:0 4px 18px rgba(232,80,110,.12)}
.counter b{display:block;font-size:1.8rem;color:var(--accent);font-family:'Playfair Display',serif}
.counter span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:20px}
.card{background:var(--card);border-radius:18px;padding:22px 16px;min-height:120px;cursor:pointer;border:2px solid transparent;box-shadow:0 4px 18px rgba(232,80,110,.1);display:flex;align-items:center;justify-content:center;transition:.25s}
.card:hover{border-color:var(--accent2)}
.card .front{font-size:2rem}
.card .back{display:none;color:var(--text);font-size:.95rem}
.card.open .front{display:none}.card.open .back{display:block}
.letter{background:var(--card);border-radius:20px;padding:30px 24px;text-align:left;box-shadow:0 6px 24px rgba(232,80,110,.12);font-family:'Playfair Display',serif;font-style:italic;font-size:1.1rem;color:var(--text)}
.letter p{color:var(--text)}
.hero-img{width:min(440px,88vw);height:auto;border-radius:22px;border:5px solid var(--card);box-shadow:0 8px 28px rgba(232,80,110,.3);margin:8px 0 18px}
.gallery{column-width:220px;column-gap:12px;margin-top:20px}
.gallery img{display:block;width:100%;height:auto;border-radius:18px;margin:0 0 12px;break-inside:avoid;box-shadow:0 4px 18px rgba(232,80,110,.15)}
footer{padding:30px;color:var(--muted);font-size:.85rem;text-align:center}
.pop{position:fixed;pointer-events:none;font-size:1.6rem;animation:rise 2.4s ease-out forwards;z-index:9}
@keyframes rise{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
</style>
</head>

  <div class="heart">💙</div>

<section>
  <h2>Reasons I love you</h2>
  <p>Tap each card.</p>
  <div class="grid" id="grid"></div>
</section>

<section>
  <h2>A little note</h2>
  <div class="letter" id="letter"></div>
</section>

<section>
  <h2>One last thing…</h2>
  <button class="btn" onclick="shower()">Press me 💌</button>
  <p id="msg" style="margin-top:18px;font-size:1.2rem;color:var(--accent)"></p>
</section>
<footer>Made with love, just for you.</footer>

<script>
// ✏️ EDIT THESE ✏️
var NICK = "babe";                 // what you call him
var REASONS = [
  ["😂","You make me laugh like no one else."],
  ["🤗","Your hugs feel like home."],
  ["🌟","You believe in me when I doubt myself."],
  ["🍕","You're my favorite person to share food with."],
  ["🎶","Every moment with you feels like my favorite song."],
  ["💪","You work so hard, and I'm proud of you."]
];
var LETTER = [
  "Dear " + NICK + ",",
  "I love you.",
  "I'm with you, always.",
  "Thank you for always being there for me, just like this.",
  "Happy Boyfriend's Day ♥"
];
var FINAL = "I love you. Now come here for a hug. 🤍";
// ✏️ END EDIT ✏️

document.getElementById('nick').textContent = NICK;
document.getElementById('letter').innerHTML = LETTER.map(function(t){return '<p>'+t+'</p>'}).join('');

var grid = document.getElementById('grid');
REASONS.forEach(function(r){
  var d = document.createElement('div'); d.className='card';
  d.innerHTML = '<div class="front">'+r[0]+'</div><div class="back">'+r[1]+'</div>';
  d.onclick = function(){d.classList.toggle('open')};
  grid.appendChild(d);
});

function shower(){
  document.getElementById('msg').textContent = FINAL;
  var e = ['💙','💖','✨','🥰','💌'];
  for(var i=0;i<30;i++){
    (function(i){setTimeout(function(){
      var p=document.createElement('div'); p.className='pop';
      p.textContent=e[Math.floor(Math.random()*e.length)];
      p.style.left=Math.random()*95+'vw'; p.style.bottom='-40px';
      document.body.appendChild(p); setTimeout(function(){p.remove()},2500);
    },i*80)})(i);
  }
}
</script>
